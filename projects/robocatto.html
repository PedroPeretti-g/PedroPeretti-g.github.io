/* ===== 3.2 Paleta fixa — "Roxo Autoridade" ===== */
const C={
  bg0:'#0B0518', bg1:'#180B33', bg2:'#2A1152',
  r0:'#A78BFA', r1:'#8B5CF6', r2:'#5B21B6',
  neon:'#C4B5FD', neon2:'#E9D8FD',
  gold:'#F5C563', goldD:'#2E1B00',
  dark:'#F7F2FF', body:'#D8C9F0', sub:'#8E7BA8',
  card:'rgba(30,12,58,0.88)', cardB:'rgba(167,139,250,0.22)',
  contraste:'#150726', contrasteB:'rgba(245,197,99,0.20)',
  white:'#fff',
};

/* ===== 3.3 Sem partículas nem estrelas ===== */
function drawStars(alpha=1){ /* desativado — não usar */ }
function drawParts(alpha=1){ /* desativado — não usar */ }
function bgSpace(a=C.bg0,b=C.bg1,c=C.bg2){
  const g=ctx.createRadialGradient(W*.5,H*.3,10,W*.5,H*.6,H*.85);
  g.addColorStop(0,c); g.addColorStop(.55,b); g.addColorStop(1,a);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  [[W*.75,H*.18,160,'rgba(167,139,250,0.07)'],[W*.12,H*.82,140,'rgba(245,197,99,0.045)']].forEach(([nx,ny,nr,nc])=>{
    const gn=ctx.createRadialGradient(nx,ny,4,nx,ny,nr);
    gn.addColorStop(0,nc); gn.addColorStop(1,'transparent');
    ctx.fillStyle=gn; ctx.fillRect(0,0,W,H);
  });
}

/* ===== 3.4 Funções helper obrigatórias ===== */
let t=0,run=false,started=false,lastF=null;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const ip=(ts,d)=>cl((t-ts)/d,0,1);
const al=p=>cl(p*4,0,1);
function eO(x){return 1-Math.pow(1-x,3);}
function elastic(x){if(x<=0)return 0;if(x>=1)return 1;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1;}
function bnc(x){x=cl(x,0,1);const n=7.5625,d=2.75;if(x<1/d)return n*x*x;else if(x<2/d){x-=1.5/d;return n*x*x+.75;}else if(x<2.5/d){x-=2.25/d;return n*x*x+.9375;}else{x-=2.625/d;return n*x*x+.984375;}}

function tPop(txt,x,y,sz,color,p,w='800'){
  const s=elastic(cl(p,0,1));
  ctx.save(); ctx.globalAlpha=al(p); ctx.shadowBlur=0;
  ctx.translate(x,y); ctx.scale(.3+s*.7,.3+s*.7);
  ctx.font=`${w} ${sz}px system-ui`; ctx.fillStyle=color;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,0);
  ctx.restore();
}
function tNeon(txt,x,y,sz,color,glow,p,w='800'){
  const s=elastic(cl(p,0,1));
  ctx.save(); ctx.globalAlpha=al(p); ctx.shadowBlur=0;
  ctx.translate(x,y); ctx.scale(.3+s*.7,.3+s*.7);
  ctx.font=`${w} ${sz}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=3;i>0;i--){ctx.shadowColor=glow;ctx.shadowBlur=i*9*s;ctx.fillStyle=glow+'33';ctx.fillText(txt,0,0);}
  ctx.shadowBlur=0; ctx.fillStyle=color; ctx.fillText(txt,0,0);
  ctx.restore();
}
function tSlide(txt,x,y,sz,color,p,w='600',align='center'){
  const s=eO(cl(p*1.6,0,1)), oy=(1-s)*16;
  ctx.save(); ctx.globalAlpha=al(p); ctx.shadowBlur=0;
  ctx.font=`${w} ${sz}px system-ui`; ctx.fillStyle=color;
  ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.fillText(txt,x,y+oy); ctx.restore();
}
function aLine(cx,cy,w2,p,color){
  const prog=eO(cl(p*1.5,0,1));
  ctx.save(); ctx.globalAlpha=al(p)*prog; ctx.shadowBlur=0;
  ctx.shadowColor=color; ctx.shadowBlur=7;
  ctx.beginPath(); ctx.roundRect(cx-w2*prog/2,cy,w2*prog,3,1.5);
  ctx.fillStyle=color; ctx.fill(); ctx.restore();
}
function glowCard(x,y,w2,h2,p,bc,bg,r=15){
  const s=eO(cl(p*1.4,0,1)), oy=(1-s)*22;
  ctx.save(); ctx.globalAlpha=al(p); ctx.shadowBlur=0;
  ctx.shadowColor=bc; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.roundRect(x,y+oy,w2,h2,r);
  ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle=bc+'55'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.shadowBlur=0; ctx.restore(); return oy;
}
function drawLogo(cx,cy,size,p,glow=false){
  if(!logoImg.complete || !logoImg.naturalWidth) return;
  const s=eO(cl(p*1.4,0,1));
  const dim=size*(.4+s*.6);
  ctx.save(); ctx.globalAlpha=al(p); ctx.shadowBlur=0;
  if(glow){
    ctx.shadowColor=C.gold; ctx.shadowBlur=26;
    ctx.beginPath(); ctx.arc(cx,cy,dim/2+3,0,Math.PI*2);
    ctx.strokeStyle=C.gold; ctx.lineWidth=2.5; ctx.stroke();
    ctx.shadowBlur=0;
  } else {
    ctx.beginPath(); ctx.arc(cx,cy,dim/2+1.5,0,Math.PI*2);
    ctx.strokeStyle='rgba(245,197,99,0.35)'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,dim/2,0,Math.PI*2); ctx.clip();
  ctx.drawImage(logoImg, cx-dim/2, cy-dim/2, dim, dim);
  ctx.restore();
  ctx.restore();
}

/* =====================================================================
   BARRA DE PROGRESSO / TELA INICIAL / LOOP
===================================================================== */
function drawBar(){
  const p=cl(t/52,0,1);
  ctx.save(); ctx.globalAlpha=.28;
  ctx.beginPath(); ctx.roundRect(20,H-14,W-40,3,1.5);
  ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.fill(); ctx.globalAlpha=1;
  ctx.shadowColor=C.neon; ctx.shadowBlur=8;
  const gp=ctx.createLinearGradient(20,0,20+(W-40)*p,0);
  gp.addColorStop(0,C.r0); gp.addColorStop(1,C.gold);
  ctx.beginPath(); ctx.roundRect(20,H-14,(W-40)*p,3,1.5);
  ctx.fillStyle=gp; ctx.fill(); ctx.restore();
}
function drawStart(){
  bgSpace();
  const pulse=1+Math.sin(Date.now()/500)*0.06;
  ctx.save();
  ctx.translate(W/2,H/2-30); ctx.scale(pulse,pulse);
  ctx.shadowColor=C.gold; ctx.shadowBlur=40;
  ctx.beginPath(); ctx.arc(0,0,64,0,Math.PI*2);
  ctx.fillStyle='rgba(245,197,99,0.12)'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.font='700 56px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('💰',0,0);
  ctx.restore();

  ctx.save();
  ctx.font='800 20px system-ui'; ctx.fillStyle=C.dark;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Resumo da Carteira',W/2,H/2+70);
  ctx.font='500 13px system-ui'; ctx.fillStyle=C.sub;
  ctx.fillText('Seu desempenho em 24 meses',W/2,H/2+96);
  ctx.restore();

  ctx.save();
  ctx.translate(W/2,H-64);
  ctx.shadowColor=C.gold; ctx.shadowBlur=16;
  ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2);
  ctx.fillStyle=C.gold; ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath();
  ctx.moveTo(-7,-11); ctx.lineTo(-7,11); ctx.lineTo(13,0); ctx.closePath();
  ctx.fillStyle=C.goldD; ctx.fill();
  ctx.restore();
}
function loop(ts){
  if(lastF===null)lastF=ts;
  const dt=(ts-lastF)/1000; lastF=ts;
  if(run){t+=dt;if(t>=52){t=52;run=false;started=false;}}
  ctx.clearRect(0,0,W,H);
  if(!started){drawStart();requestAnimationFrame(loop);return;}
  if(t<7)s2(); else if(t<16)s3(); else if(t<26)s4();
  else if(t<35)s5(); else if(t<44)s6(); else s7();
  drawBar();
  requestAnimationFrame(loop);
}
phone.addEventListener('click',()=>{
  if(!started||t>=52){t=0;started=true;run=true;lastF=null;}
});
requestAnimationFrame(loop);

// Hook de captura para Playwright (renderiza um frame exato)
window._tick = function(simT){
  t = simT; started = true; run = false; lastF = null;
  ctx.clearRect(0,0,W,H);
  if(t<7)s2(); else if(t<16)s3(); else if(t<26)s4();
  else if(t<35)s5(); else if(t<44)s6(); else s7();
  drawBar();
};
